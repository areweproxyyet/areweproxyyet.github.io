name: Refresh dependency data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'

      - name: Fetch dependency badges
        run: ruby scripts/project_deps.rb

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- docs/_data/deps.yml)" ]; then
            echo "deps.yml is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_data/deps.yml
            git commit -m "Refresh dependency badges"
            git push origin main
          fi